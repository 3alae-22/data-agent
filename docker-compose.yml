name: data-agent

networks:
  data-agent-net:
    name: data-agent-net

services:
  postgres:
    container_name: postgres_container
    image: postgres:14.17
    environment:
      POSTGRES_DB: ${database}
      POSTGRES_USER: ${user}
      POSTGRES_PASSWORD: ${password}
    ports:
      - "127.0.0.1:${port}:5432"
    volumes:
      - ./postgres/data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d
    networks:
      - data-agent-net

  sandbox:
    build:
      context: ./sandbox
    image: etl-sandbox:latest
    profiles: ["build-only"]
    networks:
      - data-agent-net